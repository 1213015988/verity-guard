<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<title>verity-guard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 14px 30px; background: #111; color: #e9e9e9;
         font: 14px/1.55 -apple-system, "Noto Sans SC", sans-serif; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .sub { color: #888; font-size: 12px; }
  .card { background: #1c1c1e; border-radius: 14px; padding: 13px 15px; margin-bottom: 11px; }
  .verdict { font-size: 19px; font-weight: 650; }
  .ok { color: #4ade80; } .warn { color: #fbbf24; } .bad { color: #f87171; }
  .row { display: flex; align-items: center; justify-content: space-between;
         padding: 6px 0; border-bottom: 1px solid #29292b; font-size: 13px; gap: 10px; }
  .row:last-child { border-bottom: 0; }
  .row .l { display: flex; flex-direction: column; min-width: 0; }
  .n { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .d { color: #777; font-size: 11px; font-family: ui-monospace, monospace;
       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 56vw; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #26262a; color: #aaa; white-space: nowrap; }
  .t-ok { background: #14361f; color: #4ade80; }
  .t-warn { background: #3a2c0c; color: #fbbf24; }
  .t-block { background: #3d1717; color: #f87171; }
  .t-unk { background: #2b2b30; color: #9a9a9a; }
  .sec { display: flex; justify-content: space-between; color: #8a8a8a; font-size: 12px; margin-bottom: 6px; }
  button { border: 0; border-radius: 11px; font-size: 14px; font-weight: 600; }
  button:disabled { background: #2a2a2e; color: #666; }
  .btnrow { display: flex; gap: 9px; margin-bottom: 4px; }
  .btnrow button { flex: 1; padding: 10px 4px; font-size: 13px; }
  #go { background: #2d5bd7; color: #fff; }
  #ini { background: #8a6d1f; color: #fff; }
  #bkup { background: #1f4a32; color: #6ee7a0; }
  .mini { padding: 5px 11px; font-size: 12px; background: #3a1d1d; color: #f87171; flex: 0 0 auto; }
  .hint { color: #fbbf24; font-size: 12px; margin-top: 7px; display: none; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  details { margin: 2px 0; }
  details > summary { cursor: pointer; list-style: none; display: flex; align-items: center;
                      justify-content: space-between; padding: 9px 0; color: #929292; font-size: 12.5px; }
  details > summary::-webkit-details-marker { display: none; }
  .chev { color: #666; font-size: 11px; margin-left: 6px; }
  details[open] .chev::after { content: '收起'; }
  details:not([open]) .chev::after { content: '展开'; }
  #mask { position: fixed; inset: 0; background: rgba(0,0,0,.62); display: none;
          align-items: center; justify-content: center; padding: 24px; z-index: 9; }
  #dlg { background: #232326; border-radius: 16px; padding: 20px; width: 100%; max-width: 380px; }
  #dlg h2 { font-size: 16px; margin: 0 0 10px; }
  #dlg p { color: #bbb; font-size: 13px; margin: 0 0 16px; }
  #dlg .btns { display: flex; gap: 10px; }
  #dlg .btns button { flex: 1; padding: 11px; }
  #cancel { background: #333; color: #ddd; }
  #okbtn { background: #b33; color: #fff; }
  #result { font-size: 12px; margin-top: 8px; display: none; }
  .seg { display: flex; gap: 6px; margin: 4px 0 8px; }
  .seg button { flex: 1; padding: 7px 0; font-size: 12px; background: #26262a; color: #aaa; }
  .seg button.on { background: #2d5bd7; color: #fff; }
  pre { margin: 0; padding: 10px; background: #0d0d0f; border-radius: 10px;
        font-size: 11px; line-height: 1.5; max-height: 240px; overflow: auto;
        white-space: pre-wrap; word-break: break-all; color: #9fb3c8; }

  #bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; overflow: hidden;
         display: none; z-index: 20; background: #1a1a1c; }
  #bar.on { display: block; }
  #bar > i { display: block; height: 100%; width: 42%;
             background: linear-gradient(90deg, #2d5bd7, #4ade80);
             border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
  .spin { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.28);
          border-top-color: #fff; border-radius: 50%; display: inline-block;
          vertical-align: -2px; margin-right: 7px; animation: rot .7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .verdict .spin { width: 15px; height: 15px; border-color: rgba(251,191,36,.3);
                   border-top-color: #fbbf24; vertical-align: -2px; }
</style>
</head>
<body>
<div id="bar"><i></i></div>
<h1>verity-guard <span style="color:#555;font-size:11px;font-weight:400">v4</span></h1>
<div class="sub" id="ts">读取中…</div>

<div class="card" style="margin-top:12px">
  <div class="verdict" id="verdict">—</div>
  <div class="sub" id="detail" style="margin-top:3px"></div>
</div>

<div class="card" id="nbc" style="display:none;background:#2a2410">
  <div style="font-size:13px;color:#fbbf24;font-weight:600">还没有基线：先点「建立基线」</div>
  <div class="sub" style="margin:3px 0 0">基线记录关键分区现在的哈希。没有它就没法判断分区有没有被改，备份也会被拒绝。这一步只读，不写分区。</div>
</div>

<div class="btnrow">
  <button id="ini">建立基线</button>
  <button id="bkup">备份</button>
  <button id="go">检查</button>
</div>
<div class="sub" style="margin:-2px 0 9px">顺序：1 建立基线 → 2 备份 → 3 检查</div>
<div class="hint" id="hint">没有检测到 KSU 的 JS 桥：回模块列表点「执行」，用音量键面板操作；或命令行 sh /data/adb/modules/vgd/action.sh</div>
<div class="sub mono" id="result"></div>

<div class="card" style="margin-top:12px">
  <div class="sec"><span>关键分区</span><span id="pcount"></span></div>
  <div id="parts"></div>
</div>

<div class="card">
  <div class="sec"><span>模块体检</span><span id="mcount"></span></div>
  <div id="mods"></div>
</div>

<div class="card">
  <div class="sec"><span>分区备份</span><span id="bcount"></span></div>
  <div id="backs"></div>
  <div class="sub" style="margin-top:8px">回写前校验副本与基线一致，写回后再复核。</div>
</div>

<div class="card">
  <div class="sec"><span>日志</span><span><span id="logts" class="sub"></span> <button id="exp" class="mini" style="background:#1e3557;color:#93c5fd">导出</button></span></div>
  <div class="seg" id="seg">
    <button data-k="vgd" class="on">守护进程</button>
    <button data-k="action">检查</button>
    <button data-k="restore">回写</button>
    <button data-k="backup">备份</button>
    <button data-k="export">导出</button>
  </div>
  <pre id="logbox">加载中…</pre>
</div>

<div class="card">
  <div class="sec"><span>基线</span></div>
  <div class="row"><span>建立时间</span><span id="bt" class="mono"></span></div>
  <div class="row"><span>备份总量</span><span id="bsz" class="mono"></span></div>
</div>

<div id="mask"><div id="dlg">
  <h2 id="dt">确认</h2>
  <p id="dtext"></p>
  <div class="btns"><button id="cancel">取消</button><button id="okbtn">确认</button></div>
</div></div>

<script>
const LV = {OK:['正常','t-ok'], WARN:['留意','t-warn'], BLOCK:['危险','t-block']};
const VD = {ok:['✅ 一切正常','ok'], warn:['⚠️ 有模块需留意','warn'],
            block:['⛔ 有危险模块','bad'], changed:['❌ 分区被修改','bad'],
            nobase:['⚪ 未建立基线','warn']};
const hasBridge = typeof ksu !== 'undefined' && ksu && typeof ksu.exec === 'function';
let logs = {}, curLog = 'vgd', dlgAction = null, busy = false, npLast = 0, baseLast = 0;

function setBusy(on, msg, btnText, btn) {
  const v = document.getElementById('verdict');
  const g = document.getElementById('go'), b = document.getElementById('bkup');
  const i = document.getElementById('ini');
  const bar = document.getElementById('bar');
  g.disabled = on; b.disabled = on; i.disabled = on;
  if (on) {
    bar.classList.add('on');
    v.className = 'verdict warn';
    v.innerHTML = '<span class="spin"></span><span id="vtext">' + msg + '</span>';
    startDots(document.getElementById('vtext'));
    if (btn) btn.innerHTML = '<span class="spin"></span>' + (btnText || '处理中…');
  } else {
    stopDots();
    bar.classList.remove('on');
    g.textContent = '检查';
    b.textContent = '备份';
    i.textContent = '建立基线';
  }
}

function ksuExec(cmd) {
  return new Promise(res => {
    if (!hasBridge) return res({errno: -1, stdout: '', stderr: 'no bridge'});
    const cb = 'vg_cb_' + Date.now() + '_' + Math.floor(Math.random() * 999);
    window[cb] = (errno, stdout, stderr) => { delete window[cb]; res({errno, stdout, stderr}); };
    try { ksu.exec(cmd, '{}', cb); }
    catch (e) { delete window[cb]; res({errno: -1, stdout: '', stderr: String(e)}); }
  });
}

function sz(n) {
  n = Number(n) || 0;
  if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
  if (n >= 1048576) return (n / 1048576).toFixed(0) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(0) + ' KB';
  return n + ' B';
}

function showResult(msg, bad) {
  const el = document.getElementById('result');
  el.style.display = 'block';
  el.textContent = msg;
  el.style.color = bad ? '#f87171' : '#4ade80';
}

let progTimer = null, lastProg = '', dotTimer = null, dotN = 0, busyLabel = '';

function startDots(el) {
  stopDots();
  busyLabel = el.textContent.replace(/\.+$/, '');
  dotTimer = setInterval(() => {
    dotN = (dotN + 1) % 4;
    el.textContent = busyLabel + '.'.repeat(dotN);
  }, 350);
}

function stopDots() {
  if (dotTimer) { clearInterval(dotTimer); dotTimer = null; }
}

function showProgress(msg) {
  if (!msg || msg === lastProg) return;
  lastProg = msg;
  const el = document.getElementById('result');
  el.style.display = 'block';
  el.style.color = '#9fb3c8';
  el.textContent = msg;
}

function startProgress() {
  stopProgress();
  lastProg = '';
  progTimer = setInterval(async () => {
    try {
      const r = await fetch('progress.txt?t=' + Date.now());
      showProgress((await r.text()).trim());
    } catch (e) {}
  }, 400);
}

function stopProgress() {
  if (progTimer) { clearInterval(progTimer); progTimer = null; }
}

async function waitDone(limitMs) {
  const t0 = Date.now();
  let last = '';
  while (Date.now() - t0 < limitMs) {
    try {
      const t = (await (await fetch('progress.txt?t=' + Date.now())).text()).trim();
      if (t && t !== last) { last = t; showProgress(t); }
      if (/完成|拒绝|失败/.test(t)) return { text: t, ms: Date.now() - t0 };
    } catch (e) {}
    await new Promise(r => setTimeout(r, 350));
  }
  return { text: last || '超时', ms: Date.now() - t0 };
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function rowsHtml(list, fn) { return list.map(fn).join(''); }

function grouped(good, bad, rowFn, titleAll, titleRest) {
  let h = '';
  if (bad.length) {
    // 有异常：整段展开，异常项排前面，正常项跟在后面，不做折叠
    h += rowsHtml(bad, rowFn) + rowsHtml(good, rowFn);
  } else {
    h += `<details><summary>${titleAll.replace('N', good.length)}<span><span class="tag t-ok">正常</span><span class="chev"></span></span></summary>${rowsHtml(good, rowFn)}</details>`;
  }
  return h || '<div class="sub">没有数据</div>';
}

function render(s) {
  const v = VD[s.verdict] || ['未知状态', ''];
  const el = document.getElementById('verdict');
  el.className = 'verdict ' + v[1];
  el.textContent = v[0];
  document.getElementById('ts').textContent = '最后检查 ' + s.ts;

  const nb = s.base === 0;
  const np = s.np || (s.parts || []).length;
  npLast = np;
  baseLast = s.base === 1 ? 1 : 0;
  document.getElementById('nbc').style.display = nb ? 'block' : 'none';

  let dtext;
  if (nb) dtext = '还没有基线：先点「建立基线」';
  else if (!s.parts_ok) dtext = '变更：' + (s.changed || '—') + (s.miss ? '　缺失：' + s.miss : '');
  else dtext = np + ' 个关键分区与基线一致';
  document.getElementById('detail').textContent = dtext;

  const parts = s.parts || [];
  document.getElementById('pcount').textContent = parts.length + ' 个';
  const PT = p => p.ok === 1 ? ['一致', 't-ok'] : (p.ok === 0 ? ['变了', 't-block'] : ['未校验', 't-unk']);
  document.getElementById('parts').innerHTML = grouped(
    parts.filter(p => p.ok === 1), parts.filter(p => p.ok !== 1),
    p => { const t = PT(p);
      return `<div class="row"><span class="n">${esc(p.n)}</span><span><span class="sub" style="margin-right:8px">${sz(p.sz)}</span>
          <span class="tag ${t[1]}">${t[0]}</span></span></div>`; },
    'N 个分区全部正常', '其余 N 个正常');

  const mods = s.modules || [];
  document.getElementById('mcount').textContent = mods.length + ' 个';
  document.getElementById('mods').innerHTML = grouped(
    mods.filter(m => m.level === 'OK'), mods.filter(m => m.level !== 'OK'),
    m => { const t = LV[m.level] || LV.OK;
      return `<div class="row"><span class="l"><span class="n">${esc(m.name)}</span>
              <span class="d">${esc(m.detail || '—')}</span></span>
              <span class="tag ${t[1]}">${t[0]}</span></div>`; },
    'N 个模块正常', '其余 N 个正常');

  const b = s.backup || {};
  const list = b.list || [];
  document.getElementById('bcount').textContent = list.length + ' 个';
  const bkRow = x => `<div class="row"><span class="l"><span class="n">${esc(x.n)}</span>
      <span class="d">${sz(x.sz)}</span></span>
      <button class="mini" data-p="${esc(x.n)}" ${(x.ok && hasBridge) ? '' : 'disabled'}>${x.ok ? '回写' : '副本异常'}</button></div>`;
  document.getElementById('backs').innerHTML = grouped(
    list.filter(x => x.ok), list.filter(x => !x.ok), bkRow,
    'N 个副本可用', '其余 N 个可用');
  document.getElementById('backs').querySelectorAll('button[data-p]').forEach(btn => {
    btn.addEventListener('click', () => askRestore(btn.dataset.p,
      sz((list.find(z => z.n === btn.dataset.p) || {}).sz)));
  });

  document.getElementById('bt').textContent = b.baseline || '—';
  document.getElementById('bsz').textContent = sz(b.sz);
  renderLog();
}

function renderLog() {
  const arr = logs[curLog] || [];
  const box = document.getElementById('logbox');
  const text = arr.length ? arr.join('\n') : '（暂无日志）';
  document.getElementById('logts').textContent = arr.length + ' 行';
  if (box.textContent === text) return;          // 内容没变就不动，避免打断阅读
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
  const prev = box.scrollTop;
  box.textContent = text;
  box.scrollTop = atBottom ? box.scrollHeight : prev;  // 只在贴底时跟随
}

function askRestore(name, size) {
  if (!hasBridge) return showResult('没有 JS 桥，请用：vg restore ' + name + ' --yes', true);
  dlgAction = 'restore';
  document.getElementById('dt').textContent = '确认回写';
  document.getElementById('dtext').textContent =
    '将把 ' + name + ' 恢复为 ' + size + ' 的副本。写入不可撤销，确认继续？';
  document.getElementById('okbtn').textContent = '确认回写';
  document.getElementById('okbtn').style.background = '#b33';
  document.getElementById('okbtn').dataset.p = name;
  document.getElementById('mask').style.display = 'flex';
}

function askBackup() {
  if (!hasBridge) return showResult('没有 JS 桥，请用：vg backup --force', true);
  dlgAction = 'backup';
  document.getElementById('dt').textContent = '重新备份';
  document.getElementById('dtext').textContent =
    '先校验 ' + (npLast || '所有') + ' 个分区与基线一致；一致才会覆盖 backup/ 下的副本。不一致会直接拒绝。继续？';
  document.getElementById('okbtn').textContent = '开始备份';
  document.getElementById('okbtn').style.background = '#2d6a45';
  document.getElementById('mask').style.display = 'flex';
}

function askInit() {
  if (!hasBridge) return showResult('没有 JS 桥，请用：sh /data/adb/modules/vgd/init.sh --yes', true);
  dlgAction = 'init';
  document.getElementById('dt').textContent = baseLast ? '重建基线' : '建立基线';
  document.getElementById('dtext').textContent = baseLast
    ? '已经有 ' + npLast + ' 个分区的基线。重建会把当前内容记成新基准，旧结论作废。只读不写。确认？'
    : '读取当前分区的哈希作为基准，只读不写。以后检测就拿它比对。确认？';
  document.getElementById('okbtn').textContent = baseLast ? '确认重建' : '开始建立';
  document.getElementById('okbtn').style.background = '#8a6d1f';
  document.getElementById('mask').style.display = 'flex';
}

async function runDlg() {
  document.getElementById('mask').style.display = 'none';
  const part = document.getElementById('okbtn').dataset.p;
  if (dlgAction === 'restore') {
    busy = true;
    setBusy(true, '正在回写 ' + part + '…', '回写中…', null);
    startProgress();
    const r = await ksuExec('sh /data/adb/modules/vgd/fire.sh restore ' + part);
    if (r.errno !== 0) {
      busy = false; stopProgress(); setBusy(false);
      return showResult('❌ 无法启动回写：' + (r.stderr || r.errno), true);
    }
    const d = await waitDone(60000);
    busy = false; stopProgress(); setBusy(false);
    await tick();
    const ok = /回写完成/.test(d.text);
    showResult((ok ? '✅ ' : '❌ ') + d.text, !ok);
  } else if (dlgAction === 'init') {
    busy = true;
    setBusy(true, '正在建立基线…', '建立中…', document.getElementById('ini'));
    startProgress();
    const r = await ksuExec('sh /data/adb/modules/vgd/fire.sh init' + (baseLast ? ' --force' : ''));
    if (r.errno !== 0) {
      busy = false; stopProgress(); setBusy(false);
      return showResult('❌ 无法启动：' + (r.stderr || r.errno), true);
    }
    const d = await waitDone(180000);
    busy = false; stopProgress(); setBusy(false);
    await tick();
    const ok = /建立完成/.test(d.text);
    showResult((ok ? '✅ ' : '⛔ ') + d.text, !ok);
  } else if (dlgAction === 'backup') {
    busy = true;
    setBusy(true, '正在备份分区…', '备份中…', document.getElementById('bkup'));
    startProgress();
    const r = await ksuExec('sh /data/adb/modules/vgd/fire.sh backup');
    if (r.errno !== 0) {
      busy = false; stopProgress(); setBusy(false);
      return showResult('❌ 无法启动备份：' + (r.stderr || r.errno), true);
    }
    const d = await waitDone(120000);
    busy = false; stopProgress(); setBusy(false);
    await tick();
    const ok = /备份完成/.test(d.text);
    showResult((ok ? '✅ ' : '⛔ ') + d.text, !ok);
  }
  dlgAction = null;
}

async function tick() {
  if (busy) { try { await fetchLogs(); } catch (e) {} return; }
  try {
    const r = await fetch('status.json?t=' + Date.now());
    render(await r.json());
  } catch (e) {
    document.getElementById('verdict').className = 'verdict bad';
    document.getElementById('verdict').textContent = '读不到 status.json';
    document.getElementById('ts').textContent = '还没跑过检查（刚装完没重启时正常，点「检查」会顺便拉起守护进程）';
  }
  try { await fetchLogs(); } catch (e) {}
}

async function fetchLogs() {
  const lr = await fetch('logs.json?t=' + Date.now());
  logs = await lr.json();
  renderLog();
}

document.getElementById('go').addEventListener('click', async () => {
  if (!hasBridge) return showResult('没有 JS 桥，请点 vgd 卡片的「执行」', true);
  busy = true;
  setBusy(true, '正在检测分区…', '检测中…', document.getElementById('go'));
  startProgress();
  const r = await ksuExec('sh /data/adb/modules/vgd/fire.sh check');
  if (r.errno !== 0) {
    busy = false; stopProgress(); setBusy(false);
    return showResult('❌ 无法启动检测：' + (r.stderr || r.errno), true);
  }
  const d = await waitDone(120000);
  busy = false; stopProgress(); setBusy(false);
  await tick();
  const ok = /检测完成/.test(d.text);
  showResult((ok ? '✅ ' : '⚠️ ') + d.text + ' · ' + (d.ms / 1000).toFixed(1) + ' 秒', !ok);
});

document.getElementById('exp').addEventListener('click', async () => {
  if (!hasBridge) return showResult('没有 JS 桥，请用命令：vg export', true);
  busy = true;
  setBusy(true, '正在打包日志…', '导出中…', null);
  startProgress();
  const r = await ksuExec('sh /data/adb/modules/vgd/fire.sh export');
  if (r.errno !== 0) {
    busy = false; stopProgress(); setBusy(false);
    return showResult('❌ 无法启动导出：' + (r.stderr || r.errno), true);
  }
  const d = await waitDone(60000);
  busy = false; stopProgress(); setBusy(false);
  showResult(d.text, !/导出完成/.test(d.text));
});

document.getElementById('bkup').addEventListener('click', askBackup);
document.getElementById('ini').addEventListener('click', askInit);
document.getElementById('seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  curLog = b.dataset.k;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  renderLog();
});
document.getElementById('cancel').addEventListener('click', () => {
  document.getElementById('mask').style.display = 'none'; dlgAction = null;
});
document.getElementById('okbtn').addEventListener('click', runDlg);

if (!hasBridge) document.getElementById('hint').style.display = 'block';
tick();
setInterval(tick, 4000);
</script>
</body>
